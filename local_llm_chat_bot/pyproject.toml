[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
# Explicitly retain the full default E4/E7/E9/F baseline; no blanket ignores.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["bosch_chat.py", "chat_workbench.py", "code_chat_agent.py", "excel_agent.py", "excel_chat_agent.py", "llm_connector_with_prompt_caching.py", "local_document_library.py", "release_safety.py", "request_runtime.py", "workbench_i18n.py", "workbench_startup.py"]
ignore_missing_imports = true
follow_imports = "skip"
check_untyped_defs = true
show_error_codes = true
