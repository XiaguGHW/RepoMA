name: Package local LLM chat bot

on:
  push:
    branches: [main]
    paths:
      - "local_llm_chat_bot/**"
      - ".github/workflows/package_local_llm_chat_bot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ZIP
        run: |
          rm -f local_llm_chat_bot.zip
          zip -qr local_llm_chat_bot.zip local_llm_chat_bot \
            -x "*/__pycache__/*" "*/tests/*" "*/.env" "*/visual_cache/*"
      - name: Commit updated ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f local_llm_chat_bot.zip
          git diff --cached --quiet || git commit -m "Update downloadable local LLM chat bot package"
          git push
