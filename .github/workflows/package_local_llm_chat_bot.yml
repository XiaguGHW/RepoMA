name: Package Bosch Assembly Assistant

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r local_llm_chat_bot/requirements-dev.txt
      - name: Run backend tests before packaging
        working-directory: local_llm_chat_bot
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Build ZIP
        run: |
          rm -rf Bosch_Assembly_Assistant Bosch_Assembly_Assistant.zip local_llm_chat_bot.zip
          mkdir Bosch_Assembly_Assistant
          while IFS= read -r path; do
            case "$path" in ''|'#'*) continue ;; esac
            test -f "local_llm_chat_bot/$path"
            cp "local_llm_chat_bot/$path" "Bosch_Assembly_Assistant/$path"
          done < local_llm_chat_bot/PACKAGE_MANIFEST.txt
          zip -qr Bosch_Assembly_Assistant.zip Bosch_Assembly_Assistant
          rm -rf Bosch_Assembly_Assistant
      - name: Commit updated ZIP
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --cached --ignore-unmatch local_llm_chat_bot.zip
          git add -f Bosch_Assembly_Assistant.zip
          git diff --cached --quiet || git commit -m "Update downloadable Bosch Assembly Assistant package"
          git push
